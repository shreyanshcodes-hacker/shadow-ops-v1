[pytest]
pythonpath = backend
testpaths = backend/tests
asyncio_mode = strict
markers =
    unit: Fast hermetic unit tests with zero external dependencies
    integration: Integration tests between services and local database
    e2e: End-to-end multi-step acceptance workflows
    live_service: Live integration tests requiring real cloud credentials
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:structlog.*
    ignore::DeprecationWarning:datetime.datetime.utcnow
